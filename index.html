<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monza Grand Prix - F1 Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #06080c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- HOME MENU SCREEN --- */
        #home-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(16, 24, 32, 0.94) 0%, rgba(6, 8, 12, 0.98) 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .menu-card {
            background: rgba(12, 16, 22, 0.9);
            border: 2px solid #2d3748;
            border-top: 5px solid #e10600;
            border-radius: 8px;
            padding: 32px 40px;
            text-align: center;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .menu-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 6px;
        }

        .menu-sub {
            font-size: 0.85rem;
            color: #8892a0;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .mode-btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode-btn {
            background: #161b22;
            border: 1px solid #30363d;
            color: #fff;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-btn:hover {
            background: #e10600;
            border-color: #ff3322;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(225, 6, 0, 0.4);
        }

        .mode-desc {
            font-size: 0.72rem;
            opacity: 0.75;
            font-weight: 400;
        }

        /* --- IN-GAME HUD --- */
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 24px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .timing-card, .leaderboard-card {
            background: rgba(10, 14, 20, 0.85);
            border-left: 4px solid #e10600;
            padding: 10px 16px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            font-family: 'Courier New', Courier, monospace;
        }

        .timing-title {
            font-size: 0.72rem;
            color: #8892a0;
            letter-spacing: 1px;
        }

        .timing-value {
            font-size: 1.35rem;
            font-weight: bold;
            color: #00ffaa;
        }

        .leaderboard-card {
            border-left: 4px solid #00d2be;
            min-width: 200px;
        }

        .leaderboard-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #334;
            padding-bottom: 4px;
        }

        .driver-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .driver-row.player {
            color: #ffcc00;
            font-weight: bold;
        }

        #top-bar-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        #home-nav-btn {
            background: rgba(20, 24, 30, 0.85);
            border: 1px solid #444;
            color: #ddd;
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #home-nav-btn:hover {
            background: #e10600;
            color: #fff;
            border-color: #ff3322;
        }

        /* F1 5-Red-Light Gantry */
        #gantry-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        .gantry-box {
            background: #111418;
            border: 3px solid #2b313a;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }

        .light-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #090a0d;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #1e2229;
        }

        .light-bulb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #250505;
            transition: background 0.08s ease, box-shadow 0.08s ease;
        }

        .light-bulb.on {
            background: #ff1100;
            box-shadow: 0 0 14px #ff1100;
        }

        #start-btn {
            margin-top: 10px;
            background: #e10600;
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(225, 6, 0, 0.5);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        #start-btn:hover {
            background: #ff2211;
            transform: scale(1.05);
        }

        .hud-center {
            align-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .drs-indicator {
            padding: 6px 18px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: rgba(15, 20, 25, 0.8);
            border: 2px solid #3e4a56;
            color: #6a7785;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .drs-indicator.eligible {
            border-color: #ffbb00;
            color: #ffbb00;
            box-shadow: 0 0 10px rgba(255, 187, 0, 0.4);
        }

        .drs-indicator.active {
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.7);
            background: rgba(0, 45, 60, 0.88);
        }

        .drs-gap-tag {
            font-size: 0.75rem;
            color: #bbb;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .hud-bottom {
            display: flex;
            justify-content: center;
        }

        .dash-display {
            background: rgba(10, 14, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 4px solid #e10600;
            border-radius: 8px;
            padding: 12px 24px;
            text-align: center;
            backdrop-filter: blur(6px);
            min-width: 250px;
        }

        .rpm-bar {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
            justify-content: center;
        }

        .rpm-segment {
            width: 11px;
            height: 8px;
            background: #252830;
            border-radius: 1px;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-around;
            align-items: baseline;
        }

        .gear-val {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .speed-val {
            font-size: 2.6rem;
            font-weight: 900;
            color: #f1f1f1;
            font-family: 'Courier New', Courier, monospace;
        }

        .pos-badge {
            font-size: 1.6rem;
            font-weight: 900;
            color: #00d2be;
        }

        .label {
            font-size: 0.68rem;
            color: #8892a0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- HOME / MODE SELECTION MENU -->
    <div id="home-screen">
        <div class="menu-card">
            <div class="menu-title">FORMULA MONZA</div>
            <div class="menu-sub">AUTODROMO NAZIONALE MONZA &bull; 2026 EDITION</div>
            
            <div class="mode-btn-grid">
                <button class="mode-btn" onclick="launchMode('practice')">
                    <span>SOLO PRACTICE</span>
                    <span class="mode-desc">JUST YOU &amp; THE CLOCK</span>
                </button>
                <button class="mode-btn" onclick="launchMode('sprint')">
                    <span>SPRINT RACE</span>
                    <span class="mode-desc">3 LAPS &bull; 6 CARS</span>
                </button>
                <button class="mode-btn" onclick="launchMode('grandprix')">
                    <span>FEATURE GRAND PRIX</span>
                    <span class="mode-desc">5 LAPS &bull; 6 CARS &bull; FULL GRID</span>
                </button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-top">
            <div class="timing-card">
                <div class="timing-title">LAP TIME</div>
                <div class="timing-value" id="lap-time">0:00.000</div>
                <div class="timing-title" style="margin-top: 4px;">BEST LAP</div>
                <div class="timing-value" id="best-time" style="color: #ffb700; font-size: 1.05rem;">--:--.---</div>
                <div class="timing-title" id="lap-counter-title" style="margin-top: 4px;">LAPS COMPLETED</div>
                <div class="timing-value" id="lap-counter" style="color: #00e5ff; font-size: 1.05rem;">0</div>
            </div>

            <div id="top-bar-center">
                <button id="home-nav-btn" onclick="returnToHome()">&#8962; HOME MENU</button>
                <div id="gantry-container">
                    <div class="gantry-box">
                        <div class="light-column"><div class="light-bulb" id="lb-0"></div></div>
                        <div class="light-column"><div class="light-bulb" id="lb-1"></div></div>
                        <div class="light-column"><div class="light-bulb" id="lb-2"></div></div>
                        <div class="light-column"><div class="light-bulb" id="lb-3"></div></div>
                        <div class="light-column"><div class="light-bulb" id="lb-4"></div></div>
                    </div>
                    <button id="start-btn" onclick="initiateStartSequence()">START RACE</button>
                </div>
            </div>

            <div class="leaderboard-card" id="leaderboard-card">
                <div class="leaderboard-title">LEADERBOARD</div>
                <div id="leaderboard-list"></div>
            </div>
        </div>

        <div class="hud-center">
            <div class="drs-indicator" id="drs-badge">DRS LOCKED</div>
            <div class="drs-gap-tag" id="drs-gap-tag">CAR AHEAD: --</div>
        </div>

        <div class="hud-bottom">
            <div class="dash-display">
                <div class="rpm-bar" id="rpm-bar"></div>
                <div class="telemetry-row">
                    <div>
                        <div class="pos-badge" id="hud-pos">P1</div>
                        <div class="label">POS</div>
                    </div>
                    <div>
                        <div class="gear-val" id="gear-text">N</div>
                        <div class="label">GEAR</div>
                    </div>
                    <div>
                        <span class="speed-val" id="speed-text">0</span>
                        <div class="label">KM/H</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas3d"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const canvas = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: window.devicePixelRatio < 1.5,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x82b1d6);
        scene.fog = new THREE.FogExp2(0x82b1d6, 0.0014);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Lighting Rig
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.85);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfffaf0, 1.15);
        sunLight.position.set(200, 320, 140);
        scene.add(sunLight);

        // RPM Segments
        const rpmContainer = document.getElementById('rpm-bar');
        for (let i = 0; i < 16; i++) {
            const seg = document.createElement('div');
            seg.className = 'rpm-segment';
            rpmContainer.appendChild(seg);
        }
        const rpmSegments = document.querySelectorAll('.rpm-segment');

        // Monza Track Spline
        const monzaPoints = [
            new THREE.Vector3(0, 0, 0),        // Start / Finish Straight
            new THREE.Vector3(0, 0, 220),      // T1 Approach
            new THREE.Vector3(12, 0, 260),     // Prima Variante
            new THREE.Vector3(-6, 0, 285),     
            new THREE.Vector3(25, 0, 370),     // Curva Grande
            new THREE.Vector3(95, 0, 460),     
            new THREE.Vector3(120, 0, 560),    
            new THREE.Vector3(112, 0, 620),    // Variante della Roggia
            new THREE.Vector3(128, 0, 645),    
            new THREE.Vector3(150, 0, 730),    // Lesmo 1
            new THREE.Vector3(205, 0, 755),    
            new THREE.Vector3(245, 0, 715),    
            new THREE.Vector3(285, 0, 665),    // Lesmo 2
            new THREE.Vector3(300, 0, 520),    // Serraglio
            new THREE.Vector3(305, 0, 360),    
            new THREE.Vector3(290, 0, 270),    // Ascari
            new THREE.Vector3(260, 0, 240),    
            new THREE.Vector3(240, 0, 180),    
            new THREE.Vector3(240, 0, 40),     // Back Straight
            new THREE.Vector3(220, 0, -80),    // Parabolica
            new THREE.Vector3(140, 0, -145),   
            new THREE.Vector3(40, 0, -110),    
            new THREE.Vector3(0, 0, -40)
        ];

        const trackCurve = new THREE.CatmullRomCurve3(monzaPoints, true, 'catmullrom', 0.15);
        const trackSteps = 450;
        const trackWidth = 14;

        // Build Track Surface and Perimeter Steel Armco Barriers
        const trackGeo = new THREE.BufferGeometry();
        const verts = [], uvs = [], indices = [];
        const barrierGeoL = new THREE.BufferGeometry(), barrierGeoR = new THREE.BufferGeometry();
        const bVertsL = [], bVertsR = [], bIndicesL = [], bIndicesR = [];
        const barrierHeight = 1.25;
        const barrierOffset = trackWidth / 2 + 0.9;

        for (let i = 0; i <= trackSteps; i++) {
            const t = (i % trackSteps) / trackSteps;
            const pt = trackCurve.getPointAt(t);
            const tan = trackCurve.getTangentAt(t);
            const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

            const left = pt.clone().add(norm.clone().multiplyScalar(trackWidth / 2));
            const right = pt.clone().add(norm.clone().multiplyScalar(-trackWidth / 2));

            verts.push(left.x, 0.05, left.z);
            verts.push(right.x, 0.05, right.z);
            uvs.push(0, i * 0.4);
            uvs.push(1, i * 0.4);

            if (i < trackSteps) {
                const b = i * 2;
                indices.push(b, b + 1, b + 2);
                indices.push(b + 1, b + 3, b + 2);
            }

            const bBaseL = pt.clone().add(norm.clone().multiplyScalar(barrierOffset));
            bVertsL.push(bBaseL.x, 0, bBaseL.z);
            bVertsL.push(bBaseL.x, barrierHeight, bBaseL.z);

            const bBaseR = pt.clone().add(norm.clone().multiplyScalar(-barrierOffset));
            bVertsR.push(bBaseR.x, 0, bBaseR.z);
            bVertsR.push(bBaseR.x, barrierHeight, bBaseR.z);

            if (i < trackSteps) {
                const bi = i * 2;
                bIndicesL.push(bi, bi + 1, bi + 2);
                bIndicesL.push(bi + 1, bi + 3, bi + 2);

                bIndicesR.push(bi, bi + 2, bi + 1);
                bIndicesR.push(bi + 1, bi + 2, bi + 3);
            }
        }

        trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        trackGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        trackGeo.setIndex(indices);
        trackGeo.computeVertexNormals();

        const trackMat = new THREE.MeshStandardMaterial({ color: 0x222428, roughness: 0.85 });
        scene.add(new THREE.Mesh(trackGeo, trackMat));

        const barrierMat = new THREE.MeshStandardMaterial({ color: 0xc8cbd0, roughness: 0.35, metalness: 0.6, side: THREE.DoubleSide });
        barrierGeoL.setAttribute('position', new THREE.Float32BufferAttribute(bVertsL, 3));
        barrierGeoL.setIndex(bIndicesL);
        barrierGeoL.computeVertexNormals();
        scene.add(new THREE.Mesh(barrierGeoL, barrierMat));

        barrierGeoR.setAttribute('position', new THREE.Float32BufferAttribute(bVertsR, 3));
        barrierGeoR.setIndex(bIndicesR);
        barrierGeoR.computeVertexNormals();
        scene.add(new THREE.Mesh(barrierGeoR, barrierMat));

        // Ground Terrain
        const groundGeo = new THREE.PlaneGeometry(1600, 1600);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x223c20, roughness: 1.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Start / Finish Line
        const startPt = trackCurve.getPointAt(0);
        const startTan = trackCurve.getTangentAt(0);
        const finishGeo = new THREE.PlaneGeometry(trackWidth, 2);
        const finishMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const finishLine = new THREE.Mesh(finishGeo, finishMat);
        finishLine.rotation.x = -Math.PI / 2;
        finishLine.position.set(startPt.x, 0.08, startPt.z);
        finishLine.rotation.z = Math.atan2(startTan.x, startTan.z);
        scene.add(finishLine);

        // --- Buildings & Scenery ---
        const matConcrete = new THREE.MeshStandardMaterial({ color: 0xe8ecf0, roughness: 0.75 });
        const matDarkTrim = new THREE.MeshStandardMaterial({ color: 0x1f232a, roughness: 0.5 });
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x152836, roughness: 0.15, metalness: 0.85 });
        const matRedBanner = new THREE.MeshStandardMaterial({ color: 0xd61414, roughness: 0.4 });
        const matMetalRoof = new THREE.MeshStandardMaterial({ color: 0x7c8594, roughness: 0.4, metalness: 0.5 });

        function buildMonzaPitBuilding(x, z) {
            const pitGroup = new THREE.Group();
            const buildingLength = 180, buildingWidth = 20, floorHeight = 4.2;

            const gFloor = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth, floorHeight, buildingLength), matConcrete);
            gFloor.position.set(0, floorHeight / 2, 0);
            pitGroup.add(gFloor);

            const garageCount = 18;
            const garageSpacing = buildingLength / garageCount;
            const garageGeo = new THREE.BoxGeometry(6, floorHeight - 0.6, garageSpacing - 1.2);
            const garageMat = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.9 });

            for (let i = 0; i < garageCount; i++) {
                const gZ = -buildingLength / 2 + garageSpacing / 2 + i * garageSpacing;
                const garage = new THREE.Mesh(garageGeo, garageMat);
                garage.position.set(-buildingWidth / 2 + 3 - 0.1, floorHeight / 2, gZ);
                pitGroup.add(garage);

                const strip = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, garageSpacing - 1.2), (i % 2 === 0) ? matRedBanner : matDarkTrim);
                strip.position.set(-buildingWidth / 2 - 0.2, floorHeight - 0.3, gZ);
                pitGroup.add(strip);
            }

            const lounge = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth - 2, 3.6, buildingLength - 2), matGlass);
            lounge.position.set(0, floorHeight + 1.8, 0);
            pitGroup.add(lounge);

            const roofSlab = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth + 2, 0.6, buildingLength + 4), matConcrete);
            roofSlab.position.set(-1, floorHeight + 3.6 + 0.3, 0);
            pitGroup.add(roofSlab);

            const tower = new THREE.Mesh(new THREE.BoxGeometry(14, 16, 22), matConcrete);
            tower.position.set(-3, 8, buildingLength / 2 + 10 - 2);
            pitGroup.add(tower);

            pitGroup.position.set(x, 0, z);
            return pitGroup;
        }

        function buildMonzaTribuna(x, z, length) {
            const grandstand = new THREE.Group();
            const rows = 12, depth = 20, height = 14;

            for (let r = 0; r < rows; r++) {
                const stepH = (r + 1) * (height / rows);
                const step = new THREE.Mesh(new THREE.BoxGeometry(length, stepH, depth / rows), matConcrete);
                step.position.set(0, stepH / 2, -depth / 2 + r * (depth / rows));
                grandstand.add(step);

                const seats = new THREE.Mesh(new THREE.BoxGeometry(length - 4, 0.35, (depth / rows) * 0.7), (r % 2 === 0) ? matRedBanner : matConcrete);
                seats.position.set(0, stepH + 0.2, -depth / 2 + r * (depth / rows));
                grandstand.add(seats);
            }

            const roof = new THREE.Mesh(new THREE.BoxGeometry(length + 6, 0.8, depth + 6), matMetalRoof);
            roof.position.set(0, height + 5, 0);
            roof.rotation.x = 0.08;
            grandstand.add(roof);

            grandstand.position.set(x, 0, z);
            grandstand.rotation.y = Math.PI / 2;
            return grandstand;
        }

        scene.add(buildMonzaPitBuilding(startPt.x + 24, startPt.z + 75));
        scene.add(buildMonzaTribuna(startPt.x - 24, startPt.z + 80, 160));

        // --- Low-Poly Procedural Formula 1 Car ---
        const noseGeo = new THREE.ConeGeometry(0.35, 1.8, 5);
        noseGeo.rotateX(Math.PI / 2);
        const cockpitGeo = new THREE.BoxGeometry(0.7, 0.32, 1.6);
        const podGeo = new THREE.BoxGeometry(0.32, 0.26, 1.2);
        const fWingGeo = new THREE.BoxGeometry(1.9, 0.05, 0.4);
        const rWingBaseGeo = new THREE.BoxGeometry(1.3, 0.08, 0.3);
        const drsFlapGeo = new THREE.BoxGeometry(1.3, 0.04, 0.25);
        const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.26, 14);
        wheelGeo.rotateZ(Math.PI / 2);

        const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const carbonMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.8 });

        function createCarMesh(hexColor) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.3, metalness: 0.2 });

            const nose = new THREE.Mesh(noseGeo, bodyMat);
            nose.position.set(0, 0.25, 1.15);
            group.add(nose);

            const cockpit = new THREE.Mesh(cockpitGeo, bodyMat);
            cockpit.position.set(0, 0.28, -0.2);
            group.add(cockpit);

            const lPod = new THREE.Mesh(podGeo, bodyMat);
            lPod.position.set(-0.46, 0.24, -0.2);
            const rPod = lPod.clone();
            rPod.position.x = 0.46;
            group.add(lPod);
            group.add(rPod);

            const fw = new THREE.Mesh(fWingGeo, carbonMat);
            fw.position.set(0, 0.15, 1.9);
            group.add(fw);

            const rw = new THREE.Mesh(rWingBaseGeo, carbonMat);
            rw.position.set(0, 0.60, -1.1);
            group.add(rw);

            const drsFlap = new THREE.Mesh(drsFlapGeo, carbonMat);
            drsFlap.position.set(0, 0.72, -1.15);
            group.add(drsFlap);

            const wheels = [];
            const wheelCoords = [
                { x: -0.75, y: 0.32, z: 0.95, steer: true },
                { x: 0.75, y: 0.32, z: 0.95, steer: true },
                { x: -0.75, y: 0.32, z: -0.85, steer: false },
                { x: 0.75, y: 0.32, z: -0.85, steer: false }
            ];

            wheelCoords.forEach(c => {
                const pivot = new THREE.Group();
                pivot.position.set(c.x, c.y, c.z);
                const tire = new THREE.Mesh(wheelGeo, tireMat);
                pivot.add(tire);
                group.add(pivot);
                wheels.push({ pivot, tire, steer: c.steer });
            });

            return { group, wheels, drsFlap };
        }

        // --- Driver Competitors ---
        const drivers = [
            { id: 'player', name: 'VER (YOU)', color: 0x0033aa, isAI: false, speed: 0, heading: 0, pos: new THREE.Vector3(), tProgress: 0.0, laps: 0, steerAngle: 0 },
            { id: 'ai1', name: 'LEC (Ferrari)', color: 0xee0000, isAI: true, topSpeed: 81, lateralOffset: -2.8, tProgress: 0.015, laps: 0 },
            { id: 'ai2', name: 'NOR (McLaren)', color: 0xff8000, isAI: true, topSpeed: 80.5, lateralOffset: 2.2, tProgress: 0.030, laps: 0 },
            { id: 'ai3', name: 'HAM (Mercedes)', color: 0x00d2be, isAI: true, topSpeed: 79.5, lateralOffset: -1.0, tProgress: 0.045, laps: 0 },
            { id: 'ai4', name: 'ALO (Aston)', color: 0x00594f, isAI: true, topSpeed: 78.5, lateralOffset: 1.8, tProgress: 0.060, laps: 0 },
            { id: 'ai5', name: 'PIA (McLaren)', color: 0xffaa33, isAI: true, topSpeed: 79.0, lateralOffset: -3.2, tProgress: 0.075, laps: 0 }
        ];

        drivers.forEach(d => {
            const carObj = createCarMesh(d.color);
            d.mesh = carObj.group;
            d.wheels = carObj.wheels;
            d.drsFlap = carObj.drsFlap;
            scene.add(d.mesh);
        });

        const player = drivers[0];
        player.pos.copy(startPt);
        player.heading = Math.atan2(startTan.x, startTan.z);
        player.topSpeed = 84;
        player.accel = 24;
        player.drag = 0.45;
        player.brake = 48;
        player.drsActive = false;
        player.drsEligible = false;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- Game Mode & State Management ---
        let currentMode = null; // 'practice', 'sprint', 'grandprix'
        let raceStarted = false;
        let sequenceActive = false;
        let targetLaps = 1;
        let lapStartTime = 0;
        let bestLapTime = null;

        const homeScreen = document.getElementById('home-screen');
        const hud = document.getElementById('hud');
        const gantryContainer = document.getElementById('gantry-container');
        const startBtn = document.getElementById('start-btn');
        const leaderboardCard = document.getElementById('leaderboard-card');
        const leaderboardList = document.getElementById('leaderboard-list');
        const lapCounter = document.getElementById('lap-counter');
        const lapTimeText = document.getElementById('lap-time');
        const bestTimeText = document.getElementById('best-time');
        const speedText = document.getElementById('speed-text');
        const gearText = document.getElementById('gear-text');
        const drsBadge = document.getElementById('drs-badge');
        const drsGapTag = document.getElementById('drs-gap-tag');
        const hudPos = document.getElementById('hud-pos');

        function launchMode(mode) {
            currentMode = mode;
            homeScreen.style.display = 'none';
            hud.style.display = 'flex';

            // Reset Cars
            player.pos.copy(startPt);
            player.heading = Math.atan2(startTan.x, startTan.z);
            player.speed = 0;
            player.steerAngle = 0;
            player.tProgress = 0.0;
            player.laps = 0;
            bestLapTime = null;
            bestTimeText.textContent = '--:--.---';
            lapCounter.textContent = '0';

            // Reset starting lights
            for (let i = 0; i < 5; i++) {
                document.getElementById(`lb-${i}`).classList.remove('on');
            }

            if (mode === 'practice') {
                // Solo mode: Hide all AI, no start lights, instant control
                drivers.slice(1).forEach(ai => ai.mesh.visible = false);
                leaderboardCard.style.display = 'none';
                gantryContainer.style.display = 'none';
                hudPos.textContent = 'SOLO';
                drsBadge.className = 'drs-indicator eligible';
                drsBadge.textContent = 'DRS ALWAYS AVAILABLE [SPACE]';
                drsGapTag.textContent = 'SOLO TIME TRIAL MODE';
                raceStarted = true;
                lapStartTime = performance.now();
            } else {
                // Race modes (Sprint or Grand Prix)
                targetLaps = (mode === 'sprint') ? 3 : 5;
                drivers.slice(1).forEach((ai, idx) => {
                    ai.mesh.visible = true;
                    ai.laps = 0;
                    ai.speed = 0;
                    ai.tProgress = 0.015 * (idx + 1);
                });
                leaderboardCard.style.display = 'block';
                gantryContainer.style.display = 'flex';
                startBtn.style.display = 'block';
                raceStarted = false;
                sequenceActive = false;
                drsBadge.className = 'drs-indicator';
                drsBadge.textContent = 'DRS LOCKED';
                drsGapTag.textContent = 'WAITING FOR RACE START';
            }
        }

        function returnToHome() {
            raceStarted = false;
            sequenceActive = false;
            currentMode = null;
            hud.style.display = 'none';
            homeScreen.style.display = 'flex';
        }

        function initiateStartSequence() {
            if (sequenceActive || raceStarted) return;
            sequenceActive = true;
            startBtn.style.display = 'none';

            let count = 0;
            const interval = setInterval(() => {
                if (count < 5) {
                    document.getElementById(`lb-${count}`).classList.add('on');
                    count++;
                } else {
                    clearInterval(interval);
                    const randomOutDelay = 1000 + Math.random() * 2000;
                    setTimeout(() => {
                        for (let i = 0; i < 5; i++) {
                            document.getElementById(`lb-${i}`).classList.remove('on');
                        }
                        raceStarted = true;
                        sequenceActive = false;
                        lapStartTime = performance.now();
                        setTimeout(() => {
                            gantryContainer.style.display = 'none';
                        }, 1200);
                    }, randomOutDelay);
                }
            }, 1000);
        }

        function formatTime(ms) {
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const msRemain = Math.floor(ms % 1000);
            return `${m}:${s.toString().padStart(2, '0')}.${msRemain.toString().padStart(3, '0')}`;
        }

        // --- Main Simulation Loop ---
        let lastTime = performance.now();

        function updateGame(dt) {
            if (!currentMode) return;

            // 1. Evaluate DRS Rules
            if (currentMode === 'practice') {
                player.drsEligible = (player.speed > 25);
                if (player.drsEligible && keys['Space']) {
                    player.drsActive = true;
                    drsBadge.className = 'drs-indicator active';
                    drsBadge.textContent = 'DRS ACTIVE';
                    player.drsFlap.rotation.x = -0.35;
                } else {
                    player.drsActive = false;
                    drsBadge.className = 'drs-indicator eligible';
                    drsBadge.textContent = 'DRS READY [SPACE]';
                    player.drsFlap.rotation.x = 0;
                }
            } else {
                let minDistanceToLeader = Infinity;
                let closestCarName = '--';

                for (let i = 1; i < drivers.length; i++) {
                    const ai = drivers[i];
                    const dist = player.pos.distanceTo(ai.mesh.position);
                    const progressDiff = (ai.laps + ai.tProgress) - (player.laps + player.tProgress);
                    if (progressDiff > 0 && progressDiff < 0.15) {
                        if (dist < minDistanceToLeader) {
                            minDistanceToLeader = dist;
                            closestCarName = ai.name.split(' ')[0];
                        }
                    }
                }

                player.drsEligible = (minDistanceToLeader <= 35.0 && player.speed > 28);

                if (player.drsEligible) {
                    drsGapTag.textContent = `AHEAD: ${closestCarName} (${minDistanceToLeader.toFixed(1)}m)`;
                    if (keys['Space']) {
                        player.drsActive = true;
                        drsBadge.className = 'drs-indicator active';
                        drsBadge.textContent = 'DRS ACTIVE';
                        player.drsFlap.rotation.x = -0.35;
                    } else {
                        player.drsActive = false;
                        drsBadge.className = 'drs-indicator eligible';
                        drsBadge.textContent = 'DRS AVAILABLE [SPACE]';
                        player.drsFlap.rotation.x = 0;
                    }
                } else {
                    player.drsActive = false;
                    player.drsFlap.rotation.x = 0;
                    drsBadge.className = 'drs-indicator';
                    drsBadge.textContent = 'DRS LOCKED';
                    drsGapTag.textContent = minDistanceToLeader < 200 
                        ? `AHEAD: ${closestCarName} (${minDistanceToLeader.toFixed(1)}m)` 
                        : 'NO CAR IN 1s GAP';
                }
            }

            // 2. Player Controls & Movement
            const steerMax = 0.52;
            let targetSteer = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) targetSteer += steerMax;
            if (keys['KeyD'] || keys['ArrowRight']) targetSteer -= steerMax;

            const speedRatio = Math.abs(player.speed) / player.topSpeed;
            targetSteer *= (1.0 - speedRatio * 0.65);
            player.steerAngle += (targetSteer - player.steerAngle) * Math.min(1, 10 * dt);

            const effectiveTopSpeed = player.drsActive ? player.topSpeed * 1.12 : player.topSpeed;
            const effectiveAccel = player.drsActive ? player.accel * 1.25 : player.accel;

            if (raceStarted && (keys['KeyW'] || keys['ArrowUp'])) {
                if (player.speed < effectiveTopSpeed) player.speed += effectiveAccel * dt;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                if (player.speed > 0) player.speed -= player.brake * dt;
                else if (raceStarted && player.speed > -10) player.speed -= 8 * dt;
            } else {
                player.speed *= Math.max(0, 1.0 - player.drag * dt);
            }

            player.heading += player.steerAngle * (player.speed / 16) * dt;
            player.pos.x += Math.sin(player.heading) * player.speed * dt;
            player.pos.z += Math.cos(player.heading) * player.speed * dt;

            // Barrier Collisions
            let closestSplineDist = Infinity;
            let bestT = player.tProgress;
            for (let i = -10; i <= 10; i++) {
                const testT = (player.tProgress + (i / trackSteps) + 1.0) % 1.0;
                const pt = trackCurve.getPointAt(testT);
                const d = player.pos.distanceTo(pt);
                if (d < closestSplineDist) {
                    closestSplineDist = d;
                    bestT = testT;
                }
            }

            const halfTrack = trackWidth / 2 + 0.2;
            if (closestSplineDist > halfTrack) {
                const centerPt = trackCurve.getPointAt(bestT);
                const bounceDir = centerPt.clone().sub(player.pos).normalize();
                player.pos.add(bounceDir.multiplyScalar(0.35));
                player.speed *= 0.72;
            }

            if (player.tProgress > 0.85 && bestT < 0.15) {
                player.laps++;
                lapCounter.textContent = player.laps;
            }
            player.tProgress = bestT;

            player.mesh.position.set(player.pos.x, 0, player.pos.z);
            player.mesh.rotation.y = player.heading;

            player.wheels.forEach(w => {
                w.tire.rotation.x += (player.speed * dt) / 0.32;
                if (w.steer) w.pivot.rotation.y = player.steerAngle;
            });

            // 3. Update AI (Only during races)
            if (currentMode !== 'practice') {
                const totalTrackLength = trackCurve.getLength();
                drivers.forEach(d => {
                    if (!d.isAI) return;

                    if (!raceStarted) {
                        const splinePt = trackCurve.getPointAt(d.tProgress);
                        const tan = trackCurve.getTangentAt(d.tProgress);
                        const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
                        const aiPos = splinePt.clone().add(norm.multiplyScalar(d.lateralOffset));
                        d.mesh.position.set(aiPos.x, 0, aiPos.z);
                        d.mesh.rotation.y = Math.atan2(tan.x, tan.z);
                        return;
                    }

                    const tangentAhead = trackCurve.getTangentAt((d.tProgress + 0.02) % 1.0);
                    const tangentCurr = trackCurve.getTangentAt(d.tProgress);
                    const curvature = tangentCurr.angleTo(tangentAhead);
                    const cornerSlowdown = Math.max(0.45, 1.0 - curvature * 3.5);
                    const aiTargetSpeed = d.topSpeed * cornerSlowdown;

                    d.speed = (d.speed || 30) + (aiTargetSpeed - (d.speed || 30)) * Math.min(1, 2.0 * dt);

                    const dtProgress = (d.speed * dt) / totalTrackLength;
                    d.tProgress += dtProgress;
                    if (d.tProgress >= 1.0) {
                        d.tProgress -= 1.0;
                        d.laps++;
                    }

                    const splinePt = trackCurve.getPointAt(d.tProgress);
                    const tan = trackCurve.getTangentAt(d.tProgress);
                    const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

                    const aiPos = splinePt.clone().add(norm.multiplyScalar(d.lateralOffset));
                    d.mesh.position.set(aiPos.x, 0, aiPos.z);
                    d.mesh.rotation.y = Math.atan2(tan.x, tan.z);

                    d.wheels.forEach(w => {
                        w.tire.rotation.x += (d.speed * dt) / 0.32;
                    });
                });

                // Update Standings
                const ranked = [...drivers].sort((a, b) => (b.laps + b.tProgress) - (a.laps + a.tProgress));
                const playerRank = ranked.findIndex(d => d.id === 'player') + 1;
                hudPos.textContent = `P${playerRank}`;

                leaderboardList.innerHTML = ranked.map((d, i) => `
                    <div class="driver-row ${d.id === 'player' ? 'player' : ''}">
                        <span>P${i + 1} ${d.name}</span>
                        <span>L${d.laps + 1}/${targetLaps}</span>
                    </div>
                `).join('');
            }

            // 4. Telemetry & Timers
            const speedKmh = Math.max(0, Math.floor(player.speed * 3.6));
            speedText.textContent = speedKmh;
            gearText.textContent = speedKmh === 0 ? 'N' : Math.min(8, Math.max(1, Math.ceil(speedKmh / 42)));

            const rpmRatio = (speedKmh % 45) / 45;
            const activeSegs = Math.floor(rpmRatio * 16);
            rpmSegments.forEach((seg, i) => {
                if (i <= activeSegs) {
                    if (i < 7) seg.style.background = '#00ff66';
                    else if (i < 12) seg.style.background = '#ffb700';
                    else seg.style.background = '#ff0033';
                } else {
                    seg.style.background = '#252830';
                }
            });

            if (raceStarted) {
                const now = performance.now();
                const currentLapMs = now - lapStartTime;
                lapTimeText.textContent = formatTime(currentLapMs);

                if (player.pos.distanceTo(startPt) < 14 && currentLapMs > 9000) {
                    if (!bestLapTime || currentLapMs < bestLapTime) {
                        bestLapTime = currentLapMs;
                        bestTimeText.textContent = formatTime(bestLapTime);
                    }
                    lapStartTime = now;
                }
            }

            // 5. Camera Follow
            const camDist = 7.2;
            const camHeight = 2.2;
            const targetCamX = player.pos.x - Math.sin(player.heading) * camDist;
            const targetCamZ = player.pos.z - Math.cos(player.heading) * camDist;

            camera.position.x += (targetCamX - camera.position.x) * 0.14;
            camera.position.z += (targetCamZ - camera.position.z) * 0.14;
            camera.position.y += ((player.pos.y + camHeight) - camera.position.y) * 0.14;

            const lookTarget = player.pos.clone().add(
                new THREE.Vector3(Math.sin(player.heading) * 6, 0.7, Math.cos(player.heading) * 6)
            );
            camera.lookAt(lookTarget);
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            updateGame(dt);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(performance.now());
    </script>
</body>
</html>
