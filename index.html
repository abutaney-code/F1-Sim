<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Prix Simulator - Realistic F1 Cars</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: #06080c;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      #canvas3d {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* --- HOME MENU --- */
      #home-screen {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(16, 24, 32, 0.95) 0%,
          rgba(6, 8, 12, 0.98) 80%
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 50;
        backdrop-filter: blur(8px);
        padding: 20px;
      }

      .menu-card {
        background: rgba(12, 16, 22, 0.92);
        border: 2px solid #2d3748;
        border-top: 5px solid #e10600;
        border-radius: 8px;
        padding: 28px 36px;
        text-align: center;
        max-width: 520px;
        width: 95%;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      }

      .menu-title {
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: 3px;
        color: #fff;
        margin-bottom: 4px;
      }

      .menu-sub {
        font-size: 0.8rem;
        color: #8892a0;
        letter-spacing: 2px;
        margin-bottom: 24px;
      }

      .mode-btn-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .mode-btn {
        background: #161b22;
        border: 1px solid #30363d;
        color: #fff;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .mode-btn:hover {
        background: #e10600;
        border-color: #ff3322;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(225, 6, 0, 0.4);
      }

      .mode-desc {
        font-size: 0.72rem;
        opacity: 0.75;
        font-weight: 400;
      }

      /* --- IN-GAME HUD --- */
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: none;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px 24px;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .timing-card,
      .leaderboard-card {
        background: rgba(10, 14, 20, 0.88);
        border-left: 4px solid #e10600;
        padding: 10px 16px;
        border-radius: 4px;
        backdrop-filter: blur(5px);
        font-family: "Courier New", Courier, monospace;
      }

      .timing-title {
        font-size: 0.7rem;
        color: #8892a0;
        letter-spacing: 1px;
      }

      .timing-value {
        font-size: 1.3rem;
        font-weight: bold;
        color: #00ffaa;
      }

      .leaderboard-card {
        border-left: 4px solid #00d2be;
        min-width: 200px;
      }

      .leaderboard-title {
        font-size: 0.75rem;
        font-weight: bold;
        color: #fff;
        margin-bottom: 6px;
        letter-spacing: 1.5px;
        border-bottom: 1px solid #334;
        padding-bottom: 4px;
      }

      .driver-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        line-height: 1.4;
      }

      .driver-row.player {
        color: #ffcc00;
        font-weight: bold;
      }

      #top-bar-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      .nav-button-group {
        display: flex;
        gap: 8px;
      }

      .hud-btn {
        background: rgba(20, 24, 30, 0.85);
        border: 1px solid #444;
        color: #ddd;
        padding: 6px 14px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .hud-btn:hover {
        background: #e10600;
        color: #fff;
        border-color: #ff3322;
      }

      .btn-box {
        border-color: #00e5ff;
        color: #00e5ff;
      }

      .btn-box.active {
        background: #004455;
        color: #00ffff;
        box-shadow: 0 0 12px #00e5ff;
      }

      /* Gantry Lights */
      #gantry-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
      }

      .gantry-box {
        background: #111418;
        border: 3px solid #2b313a;
        border-radius: 8px;
        padding: 10px 16px;
        display: flex;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      }

      .light-column {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #090a0d;
        padding: 5px;
        border-radius: 4px;
        border: 1px solid #1e2229;
      }

      .light-bulb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #250505;
        transition: background 0.08s ease, box-shadow 0.08s ease;
      }

      .light-bulb.on {
        background: #ff1100;
        box-shadow: 0 0 14px #ff1100;
      }

      #start-btn {
        margin-top: 10px;
        background: #e10600;
        color: #fff;
        border: none;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 2px;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(225, 6, 0, 0.5);
        transition: transform 0.1s ease, background 0.15s ease;
      }

      #start-btn:hover {
        background: #ff2211;
        transform: scale(1.05);
      }

      /* PIT OVERLAY */
      #pit-overlay {
        position: absolute;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 16, 24, 0.96);
        border: 2px solid #00e5ff;
        box-shadow: 0 0 24px rgba(0, 229, 255, 0.6);
        padding: 16px 28px;
        border-radius: 6px;
        text-align: center;
        display: none;
        pointer-events: auto;
        z-index: 60;
        min-width: 380px;
      }

      #pit-overlay h3 {
        font-size: 1.25rem;
        color: #00e5ff;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }

      #pit-stopwatch {
        font-family: "Courier New", Courier, monospace;
        font-size: 2rem;
        font-weight: 900;
        color: #ffaa00;
        margin: 6px 0;
        letter-spacing: 2px;
      }

      #pit-reason-text {
        font-size: 0.8rem;
        color: #ddd;
        min-height: 18px;
      }

      .hud-drs-dock {
        position: absolute;
        bottom: 110px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        pointer-events: none;
      }

      .drs-indicator {
        padding: 5px 16px;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 2px;
        background: rgba(15, 20, 25, 0.88);
        border: 2px solid #3e4a56;
        color: #6a7785;
        border-radius: 4px;
        transition: all 0.15s ease;
      }

      .drs-indicator.eligible {
        border-color: #ffbb00;
        color: #ffbb00;
        box-shadow: 0 0 10px rgba(255, 187, 0, 0.4);
      }

      .drs-indicator.active {
        border-color: #00e5ff;
        color: #00e5ff;
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.7);
        background: rgba(0, 45, 60, 0.88);
      }

      .drs-gap-tag {
        font-size: 0.7rem;
        color: #bbb;
        background: rgba(0, 0, 0, 0.75);
        padding: 2px 8px;
        border-radius: 3px;
        letter-spacing: 1px;
      }

      .hud-bottom {
        display: flex;
        justify-content: center;
      }

      .dash-display {
        background: rgba(10, 14, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-bottom: 4px solid #e10600;
        border-radius: 8px;
        padding: 10px 22px;
        text-align: center;
        backdrop-filter: blur(6px);
        min-width: 270px;
      }

      .rpm-bar {
        display: flex;
        gap: 3px;
        margin-bottom: 8px;
        justify-content: center;
      }

      .rpm-segment {
        width: 11px;
        height: 8px;
        background: #252830;
        border-radius: 1px;
      }

      .telemetry-row {
        display: flex;
        justify-content: space-around;
        align-items: baseline;
      }

      .gear-val {
        font-size: 2.8rem;
        font-weight: 900;
        color: #fff;
        line-height: 1;
      }

      .speed-val {
        font-size: 2.6rem;
        font-weight: 900;
        color: #f1f1f1;
        font-family: "Courier New", Courier, monospace;
      }

      .pos-badge {
        font-size: 1.6rem;
        font-weight: 900;
        color: #00d2be;
      }

      .compound-badge {
        font-size: 0.75rem;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 3px;
        margin-top: 4px;
        display: inline-block;
      }

      .label {
        font-size: 0.68rem;
        color: #8892a0;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="home-screen">
      <div class="menu-card">
        <div class="menu-title">RIVERSIDE GP</div>
        <div class="menu-sub">
          REALISTIC F1 AERO &bull; TEAM ASSIGNED STRATEGY
        </div>

        <div class="mode-btn-grid">
          <button class="mode-btn" onclick="launchMode('practice')">
            <span>SOLO PRACTICE</span>
            <span class="mode-desc">JUST YOU &amp; THE CLOCK</span>
          </button>
          <button class="mode-btn" onclick="launchMode('sprint')">
            <span>SPRINT RACE</span>
            <span class="mode-desc">3 LAPS &bull; 6 CARS</span>
          </button>
          <button class="mode-btn" onclick="launchMode('grandprix')">
            <span>FEATURE GRAND PRIX</span>
            <span class="mode-desc">5 LAPS &bull; FULL GRID</span>
          </button>
        </div>
      </div>
    </div>

    <div id="hud">
      <div class="hud-top">
        <div class="timing-card">
          <div class="timing-title">LAP TIME</div>
          <div class="timing-value" id="lap-time">0:00.000</div>
          <div class="timing-title" style="margin-top: 4px">SAVED BEST LAP</div>
          <div
            class="timing-value"
            id="best-time"
            style="color: #ffb700; font-size: 1.05rem"
          >
            --:--.---
          </div>
          <div class="timing-title" style="margin-top: 4px">
            TOTAL CAREER LAPS
          </div>
          <div
            class="timing-value"
            id="lap-counter"
            style="color: #00e5ff; font-size: 1.05rem"
          >
            0
          </div>
        </div>

        <div id="top-bar-center">
          <div class="nav-button-group">
            <button class="hud-btn" onclick="returnToHome()">
              &#8962; HOME
            </button>
            <button
              class="hud-btn btn-box"
              id="box-btn"
              onclick="requestPitStop()"
            >
              BOX [P]
            </button>
          </div>

          <div id="gantry-container">
            <div class="gantry-box">
              <div class="light-column">
                <div class="light-bulb" id="lb-0"></div>
              </div>
              <div class="light-column">
                <div class="light-bulb" id="lb-1"></div>
              </div>
              <div class="light-column">
                <div class="light-bulb" id="lb-2"></div>
              </div>
              <div class="light-column">
                <div class="light-bulb" id="lb-3"></div>
              </div>
              <div class="light-column">
                <div class="light-bulb" id="lb-4"></div>
              </div>
            </div>
            <button id="start-btn" onclick="initiateStartSequence()">
              START RACE
            </button>
          </div>
        </div>

        <div class="leaderboard-card" id="leaderboard-card">
          <div class="leaderboard-title">LEADERBOARD</div>
          <div id="leaderboard-list"></div>
        </div>
      </div>

      <div id="pit-overlay">
        <h3 id="pit-action-title">AUTONOMOUS PIT LANE</h3>
        <div id="pit-stopwatch">0.0s</div>
        <div id="pit-reason-text">Approaching pit box...</div>
      </div>

      <div class="hud-drs-dock">
        <div class="drs-indicator" id="drs-badge">DRS LOCKED</div>
        <div class="drs-gap-tag" id="drs-gap-tag">CAR AHEAD: --</div>
      </div>

      <div class="hud-bottom">
        <div class="dash-display">
          <div class="rpm-bar" id="rpm-bar"></div>
          <div class="telemetry-row">
            <div>
              <div class="pos-badge" id="hud-pos">P1</div>
              <div class="label">POS</div>
            </div>
            <div>
              <div class="gear-val" id="gear-text">N</div>
              <div class="label">GEAR</div>
            </div>
            <div>
              <span class="speed-val" id="speed-text">0</span>
              <div class="label">KM/H</div>
            </div>
            <div>
              <div
                id="compound-tag"
                class="compound-badge"
                style="background: #ff2222; color: #fff"
              >
                SOFT
              </div>
              <div class="label">TIRE</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <canvas id="canvas3d"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
      // Track collision phase state
      let hasCompletedFirstPit = false;

      // Assigned FIA compounds (Managed by team engineer, no manual choice)
      const teamTirePool = ["soft", "medium", "hard"];
      let currentTireCompound = "soft";

      const tireConfigs = {
        soft: {
          name: "SOFT [C4]",
          colorHex: 0xff2222,
          cssBg: "#ff2222",
          grip: 1.15,
          topSpeedMult: 1.02,
        },
        medium: {
          name: "MEDIUM [C3]",
          colorHex: 0xffcc00,
          cssBg: "#ffcc00",
          grip: 1.0,
          topSpeedMult: 1.0,
        },
        hard: {
          name: "HARD [C2]",
          colorHex: 0xffffff,
          cssBg: "#ffffff",
          grip: 0.94,
          topSpeedMult: 0.99,
        },
      };

      // --- GRAPHICS SETUP ---
      const canvas = document.getElementById("canvas3d");
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: window.devicePixelRatio < 1.5,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x82b1d6);
      scene.fog = new THREE.FogExp2(0x82b1d6, 0.0009);

      const camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        1600
      );

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.85);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xfffaf0, 1.25);
      sunLight.position.set(300, 420, 180);
      scene.add(sunLight);

      // RPM Display
      const rpmContainer = document.getElementById("rpm-bar");
      for (let i = 0; i < 16; i++) {
        const seg = document.createElement("div");
        seg.className = "rpm-segment";
        rpmContainer.appendChild(seg);
      }
      const rpmSegments = document.querySelectorAll(".rpm-segment");

      // --- Circuit Spline Layout ---
      const circuitPoints = [
        new THREE.Vector3(0, 0, 0), // Start/Finish Straight
        new THREE.Vector3(0, 0, 220), // Main straight high speed
        new THREE.Vector3(20, 0, 310), // T1 Chicane
        new THREE.Vector3(80, 0, 380),
        new THREE.Vector3(180, 0, 420), // Flat approach to North Bridge
        new THREE.Vector3(240, 1.5, 420), // Ramp start
        new THREE.Vector3(290, 4.2, 420), // Ramp crest onto bridge deck
        new THREE.Vector3(430, 4.2, 420), // Crossing over river
        new THREE.Vector3(480, 2.0, 420), // Ramp down
        new THREE.Vector3(530, 0, 420), // Touchdown east bank
        new THREE.Vector3(660, 0, 370), // City Center sector
        new THREE.Vector3(740, 0, 250), // Skyscraper waterfront
        new THREE.Vector3(760, 0, 80),
        new THREE.Vector3(700, 0, -40), // South hairpin
        new THREE.Vector3(580, 0, -100), // Flat approach to South Bridge
        new THREE.Vector3(510, 2.0, -100), // Ramp start
        new THREE.Vector3(430, 4.2, -100), // Across river
        new THREE.Vector3(290, 4.2, -100),
        new THREE.Vector3(240, 1.5, -100), // Ramp down
        new THREE.Vector3(180, 0, -100), // Touchdown west bank
        new THREE.Vector3(60, 0, -160), // Fast southern sweep
        new THREE.Vector3(-40, 0, -120), // Curva Parabolica
        new THREE.Vector3(-20, 0, -40),
      ];

      const trackCurve = new THREE.CatmullRomCurve3(
        circuitPoints,
        true,
        "catmullrom",
        0.15
      );
      const trackSteps = 700;
      const trackWidth = 14;

      // Build Multi-Layer Track: Asphalt Racing Surface, Runoff, and Armco Barriers
      const trackGeo = new THREE.BufferGeometry();
      const runoffGeo = new THREE.BufferGeometry();
      const verts = [],
        uvs = [],
        indices = [];
      const rVerts = [],
        rIndices = [];
      const barrierGeoL = new THREE.BufferGeometry(),
        barrierGeoR = new THREE.BufferGeometry();
      const bVertsL = [],
        bVertsR = [],
        bIndicesL = [],
        bIndicesR = [];
      const barrierHeight = 1.25;
      const barrierOffset = trackWidth / 2 + 3.2;

      for (let i = 0; i <= trackSteps; i++) {
        const t = (i % trackSteps) / trackSteps;
        const pt = trackCurve.getPointAt(t);
        const tan = trackCurve.getTangentAt(t);
        const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

        // Racing asphalt strip
        const left = pt
          .clone()
          .add(norm.clone().multiplyScalar(trackWidth / 2));
        const right = pt
          .clone()
          .add(norm.clone().multiplyScalar(-trackWidth / 2));
        verts.push(left.x, left.y + 0.05, left.z);
        verts.push(right.x, right.y + 0.05, right.z);
        uvs.push(0, i * 0.4);
        uvs.push(1, i * 0.4);

        // Asphalt Runoff Shoulder
        const rLeft = pt
          .clone()
          .add(norm.clone().multiplyScalar(barrierOffset - 0.2));
        const rRight = pt
          .clone()
          .add(norm.clone().multiplyScalar(-barrierOffset + 0.2));
        rVerts.push(rLeft.x, rLeft.y + 0.02, rLeft.z);
        rVerts.push(rRight.x, rRight.y + 0.02, rRight.z);

        if (i < trackSteps) {
          const b = i * 2;
          indices.push(b, b + 1, b + 2);
          indices.push(b + 1, b + 3, b + 2);

          rIndices.push(b, b + 1, b + 2);
          rIndices.push(b + 1, b + 3, b + 2);
        }

        // Armco Crash Barriers
        const bBaseL = pt
          .clone()
          .add(norm.clone().multiplyScalar(barrierOffset));
        bVertsL.push(bBaseL.x, bBaseL.y, bBaseL.z);
        bVertsL.push(bBaseL.x, bBaseL.y + barrierHeight, bBaseL.z);

        const bBaseR = pt
          .clone()
          .add(norm.clone().multiplyScalar(-barrierOffset));
        bVertsR.push(bBaseR.x, bBaseR.y, bBaseR.z);
        bVertsR.push(bBaseR.x, bBaseR.y + barrierHeight, bBaseR.z);

        if (i < trackSteps) {
          const bi = i * 2;
          bIndicesL.push(bi, bi + 1, bi + 2);
          bIndicesL.push(bi + 1, bi + 3, bi + 2);

          bIndicesR.push(bi, bi + 2, bi + 1);
          bIndicesR.push(bi + 1, bi + 2, bi + 3);
        }
      }

      trackGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(verts, 3)
      );
      trackGeo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      trackGeo.setIndex(indices);
      trackGeo.computeVertexNormals();

      const trackMat = new THREE.MeshStandardMaterial({
        color: 0x1f2124,
        roughness: 0.85,
      });
      scene.add(new THREE.Mesh(trackGeo, trackMat));

      runoffGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(rVerts, 3)
      );
      runoffGeo.setIndex(rIndices);
      runoffGeo.computeVertexNormals();
      const runoffMat = new THREE.MeshStandardMaterial({
        color: 0x42474f,
        roughness: 0.95,
      });
      scene.add(new THREE.Mesh(runoffGeo, runoffMat));

      const barrierMat = new THREE.MeshStandardMaterial({
        color: 0xc8cbd0,
        roughness: 0.35,
        metalness: 0.6,
        side: THREE.DoubleSide,
      });
      barrierGeoL.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(bVertsL, 3)
      );
      barrierGeoL.setIndex(bIndicesL);
      barrierGeoL.computeVertexNormals();
      scene.add(new THREE.Mesh(barrierGeoL, barrierMat));

      barrierGeoR.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(bVertsR, 3)
      );
      barrierGeoR.setIndex(bIndicesR);
      barrierGeoR.computeVertexNormals();
      scene.add(new THREE.Mesh(barrierGeoR, barrierMat));

      // Ground Mesh
      const groundGeo = new THREE.PlaneGeometry(2600, 2600);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x223c20,
        roughness: 1.0,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Water Feature
      const riverGroup = new THREE.Group();
      const riverBedGeo = new THREE.PlaneGeometry(160, 2000);
      const riverBedMat = new THREE.MeshStandardMaterial({
        color: 0x0c2538,
        roughness: 0.2,
        metalness: 0.8,
      });
      const riverBed = new THREE.Mesh(riverBedGeo, riverBedMat);

        lIntake.position.set(-0.52, 0.26, 0.51);

        car.add(mainPlane);

          liveryMat
        );
        lEndplate.position.set(-0.95, 0.18, 2.2);
        const rEndplate = lEndplate.clone();
        rEndplate.position.x = 0.95;
        car.add(lEndplate);
        car.add(rEndplate);

        // 9. Rear Wing Assembly & Movable DRS Flap
        const rwEndplateL = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, 0.55, 0.45),
          liveryMat
        );
        rwEndplateL.position.set(-0.68, 0.72, -1.35);

          car.add(pivot);
          wheels.push({ pivot, tire, rimRing, steer: c.steer });

        updateCarTiresVisual(currentTireCompound);

        for (let i = 0; i < 5; i++) {
          document.getElementById(`lb-${i}`).classList.remove("on");
        }

        if (mode === "practice") {
          drivers.slice(1).forEach((ai) => (ai.mesh.visible = false));
          leaderboardCard.style.display = "none";
          gantryContainer.style.display = "none";
          hudPos.textContent = "SOLO";
          drsBadge.className = "drs-indicator eligible";
          drsBadge.textContent = "DRS READY [SPACE]";
          drsGapTag.textContent = "SOLO TIME TRIAL";
          raceStarted = true;
          lapStartTime = performance.now();
        } else {
          targetLaps = mode === "sprint" ? 3 : 5;
          drivers.slice(1).forEach((ai, idx) => {
            ai.mesh.visible = true;
            ai.laps = 0;
            ai.speed = 0;
            ai.tProgress = 0.012 * (idx + 1);
          });
          leaderboardCard.style.display = "block";
          gantryContainer.style.display = "flex";
          startBtn.style.display = "block";
          raceStarted = false;
          sequenceActive = false;
          drsBadge.className = "drs-indicator";
          drsBadge.textContent = "DRS LOCKED";
          drsGapTag.textContent = "WAITING FOR GREEN LIGHT";
        }
      }

      function returnToHome() {
        raceStarted = false;
        sequenceActive = false;
        currentMode = null;
        hud.style.display = "none";
        homeScreen.style.display = "flex";
      }

      function initiateStartSequence() {
        if (sequenceActive || raceStarted) return;
        sequenceActive = true;
        startBtn.style.display = "none";

        let count = 0;
        const interval = setInterval(() => {
          if (count < 5) {
            document.getElementById(`lb-${count}`).classList.add("on");
            count++;
          } else {
            clearInterval(interval);
            const randomOutDelay = 1000 + Math.random() * 2000;
            setTimeout(() => {
              for (let i = 0; i < 5; i++) {
                document.getElementById(`lb-${i}`).classList.remove("on");
              }
              raceStarted = true;
              sequenceActive = false;
              lapStartTime = performance.now();
              setTimeout(() => {
                gantryContainer.style.display = "none";
              }, 1200);
            }, randomOutDelay);
          }
        }, 1000);
      }

      function formatTime(ms) {
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const msRemain = Math.floor(ms % 1000);
        return `${m}:${s.toString().padStart(2, "0")}.${msRemain
          .toString()
          .padStart(3, "0")}`;
      }

      // --- Loop Engine ---
      let lastTime = performance.now();

      function updateGame(dt) {
        if (!currentMode) return;

        const tireSpec = tireConfigs[currentTireCompound];

        // 1. Autonomous Pit Stop Machine
        const pitBoxPosition = new THREE.Vector3(
          startPt.x + 13,
          0,
          startPt.z + 65
        );
        const pitExitPosition = new THREE.Vector3(
          startPt.x + 10,
          0,
          startPt.z + 120
        );

        if (pitState === "REQUESTED" && player.tProgress > 0.95) {
          pitState = "APPROACHING";
          pitOverlay.style.display = "block";
          pitTitle.textContent = "AUTONOMOUS PIT ENTRY";
          pitReasonText.textContent =
            "Speed restricted to 80 km/h. Car steering into crew box.";
        }

        if (pitState === "APPROACHING") {
          const targetDir = pitBoxPosition.clone().sub(player.pos);
          const distToBox = targetDir.length();
          targetDir.normalize();

          const desiredHeading = Math.atan2(targetDir.x, targetDir.z);
          player.heading +=
            (desiredHeading - player.heading) * Math.min(1, 5 * dt);

          if (distToBox > 2.5) {
            player.speed = Math.max(10, Math.min(22, distToBox * 1.6));
          } else {
            player.speed = 0;
            pitState = "SERVICE";
            pitDuration = Number((1.2 + Math.random() * 3.8).toFixed(2));
            pitElapsedTime = 0;
            pitExplanation =
              pitReasons[Math.floor(Math.random() * pitReasons.length)];

            // Strategy: Engineer chooses next compound (No manual choice)
            const availablePool = teamTirePool.filter(
              (c) => c !== currentTireCompound
            );
            currentTireCompound =
              availablePool[Math.floor(Math.random() * availablePool.length)];
            updateCarTiresVisual(currentTireCompound);

            pitTitle.textContent = "TIRE CREW AT WORK";
            pitReasonText.textContent = `Team Strategy: Fitting FIA ${tireConfigs[currentTireCompound].name} tires...`;
          }
        } else if (pitState === "SERVICE") {
          player.speed = 0;
          pitElapsedTime += dt;
          pitStopwatch.textContent = pitElapsedTime.toFixed(2) + "s";

          // Animate mechanics kneeling and operating tools
          mechanics.forEach((m, idx) => {
            m.position.y = Math.sin(pitElapsedTime * 10 + idx) * 0.08;
            m.rotation.y = Math.sin(pitElapsedTime * 14 + idx) * 0.2;
          });

          if (pitElapsedTime >= pitDuration) {
            pitState = "EXITING";
            pitTitle.textContent = "GO! PIT RELEASE";
            pitReasonText.textContent = `Fitted ${tireConfigs[currentTireCompound].name} (${pitDuration}s) - ${pitExplanation}`;
            mechanics.forEach((m) => {
              m.position.y = 0;
              m.rotation.y = 0;
            });
          }
        } else if (pitState === "EXITING") {
          player.speed = Math.min(22, player.speed + 15 * dt);
          const targetDir = pitExitPosition.clone().sub(player.pos);
          if (targetDir.length() > 2) {
            const desiredHeading = Math.atan2(targetDir.x, targetDir.z);
            player.heading +=
              (desiredHeading - player.heading) * Math.min(1, 4 * dt);
          } else {
            pitState = "IDLE";
            boxBtn.classList.remove("active");
            boxBtn.textContent = "BOX [P]";
            pitOverlay.style.display = "none";

            // FIRST PIT COMPLETED: Walls permanently lock solid now!
            hasCompletedFirstPit = true;
          }
        }

        // 2. DRS Proximity Logic
        if (currentMode === "practice") {
          player.drsEligible = player.speed > 25;
          if (player.drsEligible && keys["Space"]) {
            player.drsActive = true;
            drsBadge.className = "drs-indicator active";
            drsBadge.textContent = "DRS ACTIVE";
            player.drsFlap.rotation.x = -0.35;
          } else {
            player.drsActive = false;
            drsBadge.className = "drs-indicator eligible";
            drsBadge.textContent = "DRS READY [SPACE]";
            player.drsFlap.rotation.x = 0;
          }
        } else {
          let minDistanceToLeader = Infinity;
          let closestCarName = "--";

          for (let i = 1; i < drivers.length; i++) {
            const ai = drivers[i];
            const dist = player.pos.distanceTo(ai.mesh.position);
            const progressDiff =
              ai.laps + ai.tProgress - (player.laps + player.tProgress);
            if (progressDiff > 0 && progressDiff < 0.15) {
              if (dist < minDistanceToLeader) {
                minDistanceToLeader = dist;
                closestCarName = ai.name.split(" ")[0];
              }
            }
          }

          player.drsEligible = minDistanceToLeader <= 35.0 && player.speed > 28;

          if (player.drsEligible) {
            drsGapTag.textContent = `AHEAD: ${closestCarName} (${minDistanceToLeader.toFixed(
              1
            )}m)`;
            if (keys["Space"]) {
              player.drsActive = true;
              drsBadge.className = "drs-indicator active";
              drsBadge.textContent = "DRS ACTIVE";
              player.drsFlap.rotation.x = -0.35;
            } else {
              player.drsActive = false;
              drsBadge.className = "drs-indicator eligible";
              drsBadge.textContent = "DRS AVAILABLE [SPACE]";
              player.drsFlap.rotation.x = 0;
            }
          } else {
            player.drsActive = false;
            player.drsFlap.rotation.x = 0;
            drsBadge.className = "drs-indicator";
            drsBadge.textContent = "DRS LOCKED";
            drsGapTag.textContent =
              minDistanceToLeader < 200
                ? `AHEAD: ${closestCarName} (${minDistanceToLeader.toFixed(
                    1
                  )}m)`
                : "NO CAR IN 1s GAP";
          }
        }

        // 3. Player Movement & Steering
        if (pitState === "IDLE" || pitState === "REQUESTED") {
          const steerMax = 0.52 * tireSpec.grip;
          let targetSteer = 0;
          if (keys["KeyA"] || keys["ArrowLeft"]) targetSteer += steerMax;
          if (keys["KeyD"] || keys["ArrowRight"]) targetSteer -= steerMax;

          const speedRatio =
            Math.abs(player.speed) / (player.topSpeed * tireSpec.topSpeedMult);
          targetSteer *= 1.0 - speedRatio * 0.65;
          player.steerAngle +=
            (targetSteer - player.steerAngle) * Math.min(1, 10 * dt);

          const effectiveTopSpeed = player.drsActive
            ? player.topSpeed * 1.12
            : player.topSpeed * tireSpec.topSpeedMult;
          const effectiveAccel = player.drsActive
            ? player.accel * 1.25
            : player.accel * tireSpec.grip;

          if (raceStarted && (keys["KeyW"] || keys["ArrowUp"])) {
            if (player.speed < effectiveTopSpeed)
              player.speed += effectiveAccel * dt;
          } else if (keys["KeyS"] || keys["ArrowDown"]) {
            if (player.speed > 0) player.speed -= player.brake * dt;
            else if (raceStarted && player.speed > -10) player.speed -= 8 * dt;
          } else {
            player.speed *= Math.max(0, 1.0 - player.drag * dt);
          }

          player.heading += player.steerAngle * (player.speed / 16) * dt;
        }

        player.pos.x += Math.sin(player.heading) * player.speed * dt;
        player.pos.z += Math.cos(player.heading) * player.speed * dt;

        // Interpolated Track Elevation & Barrier Bouncing
        let closestSplineDist = Infinity;
        let bestT = player.tProgress;
        for (let i = -10; i <= 10; i++) {
          const testT = (player.tProgress + i / trackSteps + 1.0) % 1.0;
          const pt = trackCurve.getPointAt(testT);
          const d = new THREE.Vector2(player.pos.x, player.pos.z).distanceTo(
            new THREE.Vector2(pt.x, pt.z)
          );
          if (d < closestSplineDist) {
            closestSplineDist = d;
            bestT = testT;
          }
        }

        const trackPtAtCar = trackCurve.getPointAt(bestT);
        player.pos.y = trackPtAtCar.y;

        // WALL COLLISION RULE
        if (pitState === "IDLE") {
          const halfTrack = barrierOffset;
          if (closestSplineDist > halfTrack) {
            const canPassThrough =
              !hasCompletedFirstPit && Math.random() < 0.25;
            if (!canPassThrough) {
              const bounceDir = new THREE.Vector3(
                trackPtAtCar.x - player.pos.x,
                0,
                trackPtAtCar.z - player.pos.z
              ).normalize();
              player.pos.add(bounceDir.multiplyScalar(0.35));
              player.speed *= 0.72;
            }
          }
        }

        // Lap Completion Check
        if (player.tProgress > 0.85 && bestT < 0.15) {
          player.laps++;
          lapCounter.textContent = player.laps;
        }
        player.tProgress = bestT;

        player.mesh.position.set(player.pos.x, player.pos.y, player.pos.z);
        player.mesh.rotation.y = player.heading;

        player.wheels.forEach((w) => {
          w.tire.rotation.x += (player.speed * dt) / 0.34;
          if (w.steer) w.pivot.rotation.y = player.steerAngle;
        });

        // 4. AI Opponents Update
        if (currentMode !== "practice") {
          const totalTrackLength = trackCurve.getLength();
          drivers.forEach((d) => {
            if (!d.isAI) return;

            if (!raceStarted) {
              const splinePt = trackCurve.getPointAt(d.tProgress);
              const tan = trackCurve.getTangentAt(d.tProgress);
              const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
              const aiPos = splinePt
                .clone()
                .add(norm.multiplyScalar(d.lateralOffset));
              d.mesh.position.set(aiPos.x, splinePt.y, aiPos.z);
              d.mesh.rotation.y = Math.atan2(tan.x, tan.z);
              return;
            }

            const tangentAhead = trackCurve.getTangentAt(
              (d.tProgress + 0.02) % 1.0
            );
            const tangentCurr = trackCurve.getTangentAt(d.tProgress);
            const curvature = tangentCurr.angleTo(tangentAhead);
            const cornerSlowdown = Math.max(0.45, 1.0 - curvature * 3.5);
            const aiTargetSpeed = d.topSpeed * cornerSlowdown;

            d.speed =
              (d.speed || 30) +
              (aiTargetSpeed - (d.speed || 30)) * Math.min(1, 2.0 * dt);

            const dtProgress = (d.speed * dt) / totalTrackLength;
            d.tProgress += dtProgress;
            if (d.tProgress >= 1.0) {
              d.tProgress -= 1.0;
              d.laps++;
            }

            const splinePt = trackCurve.getPointAt(d.tProgress);
            const tan = trackCurve.getTangentAt(d.tProgress);
            const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

            const aiPos = splinePt
              .clone()
              .add(norm.multiplyScalar(d.lateralOffset));
            d.mesh.position.set(aiPos.x, splinePt.y, aiPos.z);
            d.mesh.rotation.y = Math.atan2(tan.x, tan.z);

            d.wheels.forEach((w) => {
              w.tire.rotation.x += (d.speed * dt) / 0.34;
            });
          });

          const ranked = [...drivers].sort(
            (a, b) => b.laps + b.tProgress - (a.laps + a.tProgress)
          );
          const playerRank = ranked.findIndex((d) => d.id === "player") + 1;
          hudPos.textContent = `P${playerRank}`;

          leaderboardList.innerHTML = ranked
            .map(
              (d, i) => `
                    <div class="driver-row ${
                      d.id === "player" ? "player" : ""
                    }">
                        <span>P${i + 1} ${d.name}</span>
                        <span>L${d.laps + 1}/${targetLaps}</span>
                    </div>
                `
            )
            .join("");
        }

        // 5. Telemetry & Timing Update
        const speedKmh = Math.max(0, Math.floor(player.speed * 3.6));
        speedText.textContent = speedKmh;
        gearText.textContent =
          speedKmh === 0
            ? "N"
            : Math.min(8, Math.max(1, Math.ceil(speedKmh / 42)));

        const rpmRatio = (speedKmh % 45) / 45;
        const activeSegs = Math.floor(rpmRatio * 16);
        rpmSegments.forEach((seg, i) => {
          if (i <= activeSegs) {
            if (i < 7) seg.style.background = "#00ff66";
            else if (i < 12) seg.style.background = "#ffb700";
            else seg.style.background = "#ff0033";
          } else {
            seg.style.background = "#252830";
          }
        });

        if (raceStarted && pitState === "IDLE") {
          const now = performance.now();
          const currentLapMs = now - lapStartTime;
          lapTimeText.textContent = formatTime(currentLapMs);

          if (player.pos.distanceTo(startPt) < 16 && currentLapMs > 12000) {
            lapStartTime = now;
          }
        }

        // 6. Chase Camera
        const camDist = 7.2;
        const camHeight = 2.2;
        const targetCamX = player.pos.x - Math.sin(player.heading) * camDist;
        const targetCamZ = player.pos.z - Math.cos(player.heading) * camDist;

        camera.position.x += (targetCamX - camera.position.x) * 0.14;
        camera.position.z += (targetCamZ - camera.position.z) * 0.14;
        camera.position.y +=
          (player.pos.y + camHeight - camera.position.y) * 0.14;

        const lookTarget = player.pos
          .clone()
          .add(
            new THREE.Vector3(
              Math.sin(player.heading) * 6,
              0.7,
              Math.cos(player.heading) * 6
            )
          );
        camera.lookAt(lookTarget);
      }

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        updateGame(dt);
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate(performance.now());
    </script>
  </body>
</html>
